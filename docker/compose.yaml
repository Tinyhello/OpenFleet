# 開發環境：MQTT Broker 與 PostgreSQL（P2 起）。
# 啟動：docker compose -f docker/compose.yaml up -d
name: openfleet

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: openfleet-mosquitto
    ports:
      - "1883:1883"   # MQTT over TCP：.NET 後端、模擬器、Unity 桌面版
      - "9001:9001"   # MQTT over WebSocket：保留給 Unity WebGL／網頁看板評估
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: openfleet-postgres
    # 僅供本機開發：帳密寫在這裡、只綁定 127.0.0.1。上雲前必須改用機密設定。
    environment:
      POSTGRES_USER: openfleet
      POSTGRES_PASSWORD: openfleet
      POSTGRES_DB: openfleet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfleet -d openfleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
